[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "Citation-aware research assistant with semantic retrieval and optional reranking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "sentence-transformers>=6.0",
  "scikit-learn>=1.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
